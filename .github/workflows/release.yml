name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: Build binaries
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            arch: x64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            arch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # musl-gcc needed to link the vendored OpenSSL build.
      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p castbell

      - name: Archive binary
        run: |
          cp target/${{ matrix.target }}/release/castbell castbell
          tar -czf castbell-linux-${{ matrix.arch }}.tar.gz castbell

      - uses: softprops/action-gh-release@v2
        with:
          files: castbell-linux-${{ matrix.arch }}.tar.gz

  container:
    name: Build image (native ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push arch-tagged image
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/ramaro/castbell:${{ github.ref_name }}-${{ matrix.arch }}

  manifest:
    name: Join multi-arch manifest
    needs: container
    runs-on: ubuntu-24.04
    steps:
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest (version + latest)
        run: |-
          IMAGE=ghcr.io/ramaro/castbell
          TAG=${{ github.ref_name }}
          docker buildx imagetools create -t $IMAGE:$TAG \
            $IMAGE:$TAG-amd64 $IMAGE:$TAG-arm64
          docker buildx imagetools create -t $IMAGE:latest \
            $IMAGE:$TAG-amd64 $IMAGE:$TAG-arm64
